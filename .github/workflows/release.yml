name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.1)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version in configs
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          python3 - <<'EOF'
          import json, re

          version = "${{ steps.version.outputs.version }}"

          for path in ["src-tauri/tauri.conf.json", "src-tauri/Cargo.toml"]:
              with open(path) as f:
                  text = f.read()
              if path.endswith(".json"):
                  doc = json.loads(text)
                  doc["version"] = version
                  text = json.dumps(doc, indent=2) + "\n"
              else:
                  text = re.sub(r'(?m)^version = ".*"$', f'version = "{version}"', text, count=1)
              with open(path, "w") as f:
                  f.write(text)
          EOF

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Build and sign bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Kyber v__VERSION__"
          releaseBody: "Download for macOS below. The app auto-updates from this feed."
          releaseDraft: false
          prerelease: false
          args: "--target aarch64-apple-darwin"
