<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kyber Code</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="window-drag-region" data-tauri-drag-region="deep" aria-hidden="true"></div>
    <main class="app-frame" aria-label="Kyber Code">

          height="500"
        />

      <pre class="error" id="error" hidden></pre>
    </main>
    <script src="app.js"></script>
  </body>
</html>
