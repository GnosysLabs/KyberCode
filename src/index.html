<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kyber</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-frame" aria-label="Kyber">
      <header class="chrome">
        <div class="window-drag-region" data-tauri-drag-region aria-hidden="true"></div>
        <img
          class="chrome-mark"
          src="assets/kyber-logo.png"
          alt="Kyber"
          width="1184"
          height="362"
        />
      </header>

      <section class="stage">
        <div class="brand-lockup" id="lockup">
          <img
            class="kyber-mark"
            src="assets/kyber-logo.png"
            alt=""
            width="1184"
            height="362"
          />
          <p class="status" id="status">Starting DeepSeek Harness…</p>
        </div>
        <pre class="error" id="error" hidden></pre>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
